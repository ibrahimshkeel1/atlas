[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Start command is in Dockerfile CMD (migrations + uvicorn).
# For the worker service, override start to: sh scripts/start_worker.sh
